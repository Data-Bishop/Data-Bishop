<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 190" width="820" height="190" role="img" aria-labelledby="t d">
<title id="t">Data pipeline</title>
<desc id="d">Data flowing from APIs, databases and events through ingest, process and store stages to serving.</desc>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .line { stroke: #9198a1; stroke-width: 1.5; fill: none; opacity: .55; }
  .node { fill: #151b23; stroke: #9198a1; stroke-width: 1.5; }
  .glyph { stroke: #f0f6fc; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .name { fill: #f0f6fc; font-size: 13px; font-weight: 600; text-anchor: middle; }
  .sub { fill: #9198a1; font-size: 10.5px; text-anchor: middle; }
  .src { fill: #f0f6fc; font-size: 12px; text-anchor: middle; }
  .p { opacity: 0; animation: flow linear infinite; }
  .spin { transform-origin: 400px 87px; animation: spin 6s linear infinite; }
  .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 2.4s ease-in-out infinite; }
  .q { animation: pulse 1.8s ease-in-out infinite; }
  @keyframes flow {
    0% { transform: translate(0, 0); opacity: 0; }
    12%, 88% { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes grow { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .p, .spin, .bar, .q { animation: none; }
    .p { opacity: 1; transform: translate(calc(var(--dx) / 2), calc(var(--dy) / 2)); }
  }
</style>
